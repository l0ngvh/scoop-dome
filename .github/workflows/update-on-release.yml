name: Update on Release

on:
  repository_dispatch:
    types: [new-nightly-release]

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update manifest
        env:
          VERSION: ${{ github.event.client_payload.version }}
          SHA_ZIP: ${{ github.event.client_payload.sha_zip }}
        run: |
          set -euo pipefail
          if [ -z "$VERSION" ] || [ -z "$SHA_ZIP" ]; then
            echo "::error::dispatch payload is missing version or sha_zip"
            exit 1
          fi
          jq --arg v "$VERSION" --arg h "$SHA_ZIP" '
            .version = $v
            | .architecture."64bit".url =
                "https://github.com/l0ngvh/Dome/releases/download/nightly-\($v)/dome-nightly-\($v)-x86_64-pc-windows-msvc.zip"
            | .architecture."64bit".hash = $h
          ' bucket/dome-nightly.json > tmp.json
          mv tmp.json bucket/dome-nightly.json
      - name: Commit and push
        env:
          VERSION: ${{ github.event.client_payload.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/dome-nightly.json
          git commit -m "build: bump dome-nightly to $VERSION"
          git push
